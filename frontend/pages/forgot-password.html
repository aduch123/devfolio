<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Forgot password | Devfolio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth-body">
    <div class="auth-wrapper">
      <div class="editor-window auth-card">
        <div class="editor-titlebar">
          <span class="dot dot-red"></span>
          <span class="dot dot-amber"></span>
          <span class="dot dot-green"></span>
          <span class="editor-filename">forgot.js</span>
        </div>
        <form id="forgot-form" class="auth-form" novalidate>
          <h1 class="auth-title" id="forgot-title">Forgot your password?</h1>
          <p class="auth-message" id="forgot-message">
            Enter your email and we will send you a link to choose a new one.
          </p>
          <div class="field">
            <label for="forgot-email">Email</label>
            <input type="email" id="forgot-email" name="email" autocomplete="email" required />
          </div>
          <p class="auth-error" id="forgot-error" role="alert"></p>
          <button type="submit" class="btn">Send reset link</button>
          <p class="auth-switch"><a href="/login">Back to log in</a></p>
        </form>
      </div>
    </div>
    <script type="module" src="/js/forgotPassword.js"></script>
  </body>
</html>
