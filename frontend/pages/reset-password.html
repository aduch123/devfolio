<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Reset password | Devfolio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth-body">
    <div class="auth-wrapper">
      <div class="editor-window auth-card">
        <div class="editor-titlebar">
          <span class="dot dot-red"></span>
          <span class="dot dot-amber"></span>
          <span class="dot dot-green"></span>
          <span class="editor-filename">reset.js</span>
        </div>
        <form id="reset-form" class="auth-form" novalidate>
          <h1 class="auth-title" id="reset-title">Choose a new password</h1>
          <p class="auth-message" id="reset-message"></p>
          <div class="field">
            <label for="reset-password">New password</label>
            <div class="password-wrap">
              <input
                type="password"
                id="reset-password"
                name="password"
                autocomplete="new-password"
                required
                maxlength="128"
              />
              <button
                type="button"
                class="pw-toggle"
                data-toggle="reset-password"
                aria-label="Show password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
            <small class="field-hint">At least 8 characters.</small>
          </div>
          <div class="field">
            <label for="reset-confirm">Confirm password</label>
            <input
              type="password"
              id="reset-confirm"
              name="confirm"
              autocomplete="new-password"
              required
              maxlength="128"
            />
          </div>
          <p class="auth-error" id="reset-error" role="alert"></p>
          <button type="submit" class="btn">Reset password</button>
          <p class="auth-switch" id="reset-links">
            <a href="/forgot-password">Request a new link</a>
          </p>
        </form>
      </div>
    </div>
    <script type="module" src="/js/resetPassword.js"></script>
  </body>
</html>
