<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="editor-window auth-card">
      <div class="editor-titlebar">
        <span class="dot dot-red"></span>
        <span class="dot dot-amber"></span>
        <span class="dot dot-green"></span>
        <span class="editor-filename" id="auth-filename">login.js</span>
      </div>

      <div class="auth-panels" id="auth-panels">

        <form id="login-form" class="auth-panel active">
          <h2 class="auth-title">Welcome back</h2>
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required>
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required>
          </div>
          <p class="auth-error" id="login-error"></p>
          <button type="submit" class="btn">Log in</button>
          <p class="auth-switch">No account? <a href="#" data-target="signup">Sign up</a></p>
        </form>

        <form id="signup-form" class="auth-panel">
          <h2 class="auth-title">Create account</h2>
          <div class="field">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" required>
          </div>
          <div class="field">
            <label for="signup-username">Username</label>
            <input type="text" id="signup-username" required minlength="3">
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" required minlength="8">
          </div>
          <p class="auth-error" id="signup-error"></p>
          <button type="submit" class="btn">Sign up</button>
          <p class="auth-switch">Have an account? <a href="#" data-target="login">Log in</a></p>
        </form>

      </div>
    </div>
  </div>

  <script type="module" src="../js/auth.js"></script>
</body>
</html>
