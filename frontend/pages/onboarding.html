<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set up your portfolio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/onboarding.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body class="auth-body">
    <div class="auth-wrapper" style="max-width: 560px">
      <div class="editor-window auth-card">
        <div class="editor-titlebar">
          <span class="dot dot-red"></span>
          <span class="dot dot-amber"></span>
          <span class="dot dot-green"></span>
          <span class="editor-filename">onboarding.js</span>
        </div>

        <form id="onboarding-form" class="onboarding-body">
          <h2 class="auth-title">Set up your portfolio</h2>

          <div class="field">
            <label for="displayName">Display name</label>
            <input type="text" id="displayName" required />
          </div>
          <div class="field">
            <label for="aboutText">About you</label>
            <textarea id="aboutText" rows="4" required></textarea>
          </div>
          <div class="field">
            <label for="contactEmail">Contact email</label>
            <input type="email" id="contactEmail" />
          </div>
          <div class="field">
            <label for="contactPhone">Phone (optional)</label>
            <input type="text" id="contactPhone" />
          </div>
          <div class="field">
            <label for="githubUrl">GitHub URL</label>
            <input type="url" id="githubUrl" />
          </div>

          <label>Role phrases (animated)</label>
          <div id="roles-list"></div>
          <button type="button" class="btn btn-outline" id="add-role">+ Add role phrase</button>

          <label>Skills</label>
          <div id="skills-list"></div>
          <button type="button" class="btn btn-outline" id="add-skill">+ Add skill</button>

          <label>Projects</label>
          <div id="projects-list"></div>
          <button type="button" class="btn btn-outline" id="add-project">+ Add project</button>

          <p class="auth-error" id="onboarding-error"></p>
          <button type="submit" class="btn">Finish setup</button>
        </form>
      </div>
    </div>

    <script type="module" src="../js/onboarding.js"></script>
  </body>
</html>
