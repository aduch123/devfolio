<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set up your portfolio | Devfolio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/onboarding.css" />
  </head>
  <body class="wiz-body">
    <header class="wiz-top">
      <span class="wiz-brand">dev<span class="wiz-brand-accent">folio</span></span>
      <span class="wiz-top-note">Set up your portfolio</span>
    </header>

    <main class="wiz-layout">
      <section class="wiz-main">
        <ol id="wiz-steps" class="wiz-steps" aria-label="Setup progress"></ol>
        <div id="wiz-panel" class="wiz-card" aria-live="polite">
          <p class="wiz-loading" role="status">Loading…</p>
        </div>
      </section>

      <aside id="wiz-preview" class="wiz-preview" aria-label="Live preview"></aside>
    </main>

    <script type="module" src="/js/onboarding.js"></script>
  </body>
</html>
